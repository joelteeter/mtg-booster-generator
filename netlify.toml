# Static site: index.html loads css/ and js/ from next to it, so the
# repo root is published as-is and there is nothing to build.
# (build.py only produces dist/mtg-booster-generator.html, the shareable
# single-file copy, which is committed and served at that path too.)

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
