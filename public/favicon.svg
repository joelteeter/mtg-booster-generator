<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Skull and crossbones">
  <!--
    Favicon: a skull and crossbones drawn as a mana-style badge.
    Original artwork; it borrows the round bone-grey badge look of Magic's
    mana symbols without reproducing Wizards' own black mana symbol.
    Shapes are kept bold and few so it still reads at 16 px.
  -->
  <defs>
    <clipPath id="badge"><circle cx="50" cy="50" r="47"/></clipPath>
  </defs>

  <!-- bone-grey badge -->
  <circle cx="50" cy="50" r="47" fill="#CFC9C3"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#7E7671" stroke-width="3"/>

  <g clip-path="url(#badge)" fill="#15120F">
    <!-- crossbones, behind the skull: shafts plus knobbed ends -->
    <g stroke="#15120F" stroke-width="9" stroke-linecap="round">
      <line x1="22" y1="22" x2="78" y2="78"/>
      <line x1="78" y1="22" x2="22" y2="78"/>
    </g>
    <g>
      <circle cx="19" cy="16" r="6"/><circle cx="16" cy="25" r="6"/>
      <circle cx="81" cy="16" r="6"/><circle cx="84" cy="25" r="6"/>
      <circle cx="19" cy="84" r="6"/><circle cx="16" cy="75" r="6"/>
      <circle cx="81" cy="84" r="6"/><circle cx="84" cy="75" r="6"/>
    </g>

    <!-- skull: cranium over a narrower jaw -->
    <path d="M50 20
             c-16 0 -25 11 -25 24
             c0 8 4 14 9 18
             v6 c0 3 2 5 5 5
             h22 c3 0 5-2 5-5
             v-6 c5-4 9-10 9-18
             c0-13 -9-24 -25-24 z"/>
  </g>

  <!-- knocked-out features, in the badge colour -->
  <g fill="#CFC9C3">
    <ellipse cx="39" cy="44" rx="8" ry="9"/>
    <ellipse cx="61" cy="44" rx="8" ry="9"/>
    <path d="M50 54 l5 9 h-10 z"/>
    <rect x="43" y="66" width="3.5" height="8" rx="1.2"/>
    <rect x="48.5" y="66" width="3.5" height="8" rx="1.2"/>
    <rect x="54" y="66" width="3.5" height="8" rx="1.2"/>
  </g>
</svg>
