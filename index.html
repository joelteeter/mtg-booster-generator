<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTG Play Booster CSV Generator</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; background: #f4f4f9; padding: 20px; line-height: 1.6; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        select, input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; box-sizing: border-box; }
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-row > div { flex: 1; }
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        .checkbox-row input { width: auto; margin: 0; cursor: pointer; }
        .info-box { background: #e7f3ff; border-left: 4px solid #007bff; padding: 15px; margin-top: 20px; border-radius: 4px; font-size: 0.9rem; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .download-area { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 20px; }
        .dl-link { background: #28a745; color: white; text-decoration: none; padding: 10px; text-align: center; border-radius: 6px; font-weight: bold; font-size: 0.85rem; border: 1px solid #1e7e34; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; color: #007bff; }
        #downloadContainer { display: none; margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Play Booster CSV Generator</h2>
    
    <div class="flex-row">
        <div>
            <label for="setSelect">Choose Expansion (Live API):</label>
            <select id="setSelect"><option value="">Loading...</option></select>
        </div>
        <div>
            <label for="customSet">Or Type Set Code:</label>
            <input type="text" id="customSet" placeholder="e.g. sos, dsk, vma">
        </div>
    </div>

    <div class="flex-row">
        <div>
            <label for="packCount">Number of Packs:</label>
            <input type="number" id="packCount" value="3" min="1" max="100">
        </div>
        <div>
            <label for="funMultiplier">Fun Booster Multiplier:</label>
            <select id="funMultiplier">
                <option value="1">x1 (Standard Odds)</option>
                <option value="2">x2</option>
                <option value="3">x3</option>
                <option value="4">x4</option>
                <option value="5">x5</option>
            </select>
        </div>
    </div>

    <div class="info-box">
        <strong>✨ Version Selection Logic:</strong>
        <p style="margin:5px 0">Fetches <code>unique:prints</code> to find all art variants. If a card has multiple versions, the console will log which specific Collector Number was chosen.</p>
    </div>

    <div class="checkbox-row">
        <input type="checkbox" id="preferGuestList">
        Prefer Guest List versions (50% swap chance)?
    </div>

    <div class="flex-row">
        <label class="checkbox-row">
            <input type="checkbox" id="foilToggle">
            Enable Foil Slot (#13)?
        </label>
        <label class="checkbox-row">
            <input type="checkbox" id="includeBonus" checked>
            Include Bonus Dual/Fetch?
        </label>
    </div>

    <button id="genBtn">Generate Booster Files</button>
    <div id="status">Ready</div>
    <div id="downloadContainer">
        <label>Download Booster CSVs:</label>
        <div id="downloadList" class="download-area"></div>
    </div>
</div>

    const downloadContainer = document.getElementById('downloadContainer');
    const downloadList = document.getElementById('downloadList');
    const setSelect = document.getElementById('setSelect');

    const bonusPool = [

        { section: "columna", name: "Tropical Island", mana_cost: "", type_line: "Land — Forest Island", set_name: "30th Anniversary Edition", set: "30a", collector_number: "279", artist: "Jesper Myrfors", usd: "271.66", eur: "372.53", tix: "11.04", uri: "https://scryfall.com", id: "2d9d4f2e-5a41-410d-b1c3-47e4aca07177" },

        { section: "columnb", name: "Flooded Strand", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 3", set: "mh3", collector_number: "464", artist: "Alexander Forssberg", usd: "18.35", eur: "16.61", tix: "3.67", uri: "https://scryfall.com", id: "431eca69-ba8c-47c8-a325-22a844f83e80" },
        { section: "columnb", name: "Wooded Foothills", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 3", set: "mh3", collector_number: "467", artist: "Chris Ostrowski", usd: "20.86", eur: "17.29", tix: "2.46", uri: "https://scryfall.com", id: "32af6676-e780-4ebf-b2d3-0bc3436e527c" },
        { section: "columnb", name: "Polluted Delta", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 3", set: "mh3", collector_number: "465", artist: "Chris Ostrowski", usd: "23.64", eur: "18.5", tix: "1.95", uri: "https://scryfall.com", id: "797b30b0-bc82-43fd-a842-d5879e2441bd" },
        { section: "columna", name: "Savannah", mana_cost: "", type_line: "Land — Forest Plains", set_name: "30th Anniversary Edition", set: "30a", collector_number: "276", artist: "Rob Alexander", usd: "183.66", eur: "209.76", tix: "3.69", uri: "https://scryfall.com", id: "3af5afd0-1b5b-4055-9d90-87356090911f" },
        { section: "columna", name: "Taiga", mana_cost: "", type_line: "Land — Mountain Forest", set_name: "30th Anniversary Edition", set: "30a", collector_number: "278", artist: "Rob Alexander", usd: "260.0", eur: "220.13", tix: "3.56", uri: "https://scryfall.com", id: "e53c3622-1000-4727-9473-bacf20c8d682" },
        { section: "columnb", name: "Verdant Catacombs", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 2", set: "mh2", collector_number: "479", artist: "Vance Kovacs", usd: "28.94", eur: "24.08", tix: "0.99", uri: "https://scryfall.com", id: "c7057b04-e22f-4e33-9f08-b9fbd2e54bf5" },
        { section: "columna", name: "Tundra", mana_cost: "", type_line: "Land — Plains Island", set_name: "30th Anniversary Edition", set: "30a", collector_number: "280", artist: "Jesper Myrfors", usd: "237.49", eur: "0.25", tix: "11.96", uri: "https://scryfall.com", id: "79fc39a1-6a9d-4893-a41b-e8d13fb0d108" },
        { section: "columna", name: "Badlands", mana_cost: "", type_line: "Land — Swamp Mountain", set_name: "30th Anniversary Edition", set: "30a", collector_number: "273", artist: "Rob Alexander", usd: "298.2", eur: "0.02", tix: "4.57", uri: "https://scryfall.com", id: "c5335e87-57e3-4da6-aba0-619628120f47" },
        { section: "columnb", name: "Arid Mesa", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 2", set: "mh2", collector_number: "475", artist: "Raymond Swanland", usd: "31.7", eur: "28.42", tix: "3.65", uri: "https://scryfall.com", id: "54ced5cf-b51a-4dab-97f7-50fb18e5c463" },
        { section: "columna", name: "Volcanic Island", mana_cost: "", type_line: "Land — Island Mountain", set_name: "30th Anniversary Edition", set: "30a", collector_number: "282", artist: "Brian Snõddy", usd: "295.29", eur: "527.22", tix: "11.51", uri: "https://scryfall.com", id: "12f74d08-d020-4c89-a1a2-0815b8b65755" },
        { section: "columnb", name: "Bloodstained Mire", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 3", set: "mh3", collector_number: "463", artist: "Bruce Brenneise", usd: "20.33", eur: "17.65", tix: "2.13", uri: "https://scryfall.com", id: "3de472d0-cca2-4bc3-ab0a-9f79fa6325ce" },
        { section: "columnb", name: "Scalding Tarn", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 2", set: "mh2", collector_number: "478", artist: "Philip Straub", usd: "34.64", eur: "28.19", tix: "3.07", uri: "https://scryfall.com", id: "229ecfc9-8d6b-4fdb-9001-64dc3e4e7a3f" },
        { section: "columnb", name: "Marsh Flats", mana_cost: "", type_line: "Land", set_name: "Modern Horizons 2", set: "mh2", collector_number: "476", artist: "Izzy", usd: "28.91", eur: "24.3", tix: "0.91", uri: "https://scryfall.com", id: "4e8397e6-d13a-4996-8fde-b8a9895de287" }
    ];

    // Initialize set list using the correct API endpoint root
    async function initSetList() {
        const root = "https://api.scryfall.com/";
        try {
            const response = await fetch(root + "sets", {
                method: 'GET',
                headers: { 'Accept': 'application/json', 'User-Agent': 'MTGBoosterSim/1.0' }
            });
            const data = await response.json();
            const allowedTypes = ['expansion', 'core', 'masters', 'draft_innovation'];
            const filteredSets = data.data
                .filter(s => allowedTypes.includes(s.set_type) && s.code.length === 3)
                .sort((a, b) => new Date(b.released_at) - new Date(a.released_at));

            setSelect.innerHTML = filteredSets.map(s => 
                `<option value="${s.code}">${s.name} (${s.code.toUpperCase()})</option>`
            ).join('');
        } catch (e) {
            setSelect.innerHTML = `<option value="">Error loading sets</option>`;
            console.error("Set fetch failed:", e);
        }
    }

    async function fetchPool(query) {
        const endpoint = "https://api.scryfall.com/cards/search?q=";
        
        // Append unique:prints to the query string to ensure all art variations are returned
        const fullQuery = query + " unique:prints";
        const fullUrl = endpoint + encodeURIComponent(fullQuery);
        
        //console.log("Fetching from API:", fullUrl);

        const response = await fetch(fullUrl, {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'User-Agent': 'MTGBoosterSim/1.0' 
            }
        });

        if (!response.ok) {
            if (response.status === 404) return []; 
            throw new Error(`Scryfall API Error: ${response.status}`);
        }

        const data = await response.json();
        return data.data;
    }

    function groupByName(cards) {
        const map = new Map();
        cards.forEach(c => {
            if (!map.has(c.name)) map.set(c.name, []);
            map.get(c.name).push(c);
        });
        return map;
    }

    function pickRandomVariant(nameMap) {
        const names = Array.from(nameMap.keys());
        if (names.length === 0) return null;
        const randomName = names[Math.floor(Math.random() * names.length)];
        const variants = nameMap.get(randomName);
        
        const chosen = variants[Math.floor(Math.random() * variants.length)];

        // Log if there was a choice between multiple versions
        if (variants.length > 1) {
            const ids = variants.map(v => v.collector_number).join(", ");
            console.log(`Selection logic: Chose ID ${chosen.collector_number} out of available [${ids}] for card "${randomName}"`);
        }

        return chosen;
    }

    function formatToFullCSV(card, isFoil = false, manualSection = null) {
        const section = manualSection || (card.type_line && card.type_line.toLowerCase().includes("land") ? "lands" : "nonlands");
        return [
            section, 1, `"${card.name}"`, `"${card.mana_cost || ''}"`, `"${card.type_line || ''}"`,
            `"${card.set_name || ''}"`, card.set || "", `"${card.collector_number || ''}"`,
            card.lang || "en", card.rarity || "", `"${card.artist || ''}"`, isFoil ? "foil" : "nonfoil",
            card.usd || card.prices?.usd || "", card.eur || card.prices?.eur || "",
            card.tix || card.prices?.tix || "", card.scryfall_uri || card.uri || "", card.id || ""
        ].join(",");
    }

    genBtn.addEventListener('click', async () => {
        const customCode = document.getElementById('customSet').value.toLowerCase().trim();
        const setCode = (customCode || setSelect.value).toUpperCase();
        const packCount = parseInt(document.getElementById('packCount').value);
        const multiplier = parseInt(document.getElementById('funMultiplier').value);
        const includeBonus = document.getElementById('includeBonus').checked;
        const foilToggle = document.getElementById('foilToggle').checked;
        const preferGuest = document.getElementById('preferGuestList').checked;
        
        status.textContent = `⏳ Pulling data for ${setCode}...`;
        genBtn.disabled = true;
        downloadList.innerHTML = "";
        downloadContainer.style.display = "none";

        try {
            const [rares, mythics, uncommons, commons, nonBasicLands, anyRarity, spgAll] = await Promise.all([
                fetchPool(`s:${setCode} r:rare -is:promo -t:basic`),
                fetchPool(`s:${setCode} r:mythic -is:promo -t:basic`),
                fetchPool(`s:${setCode} r:uncommon -is:promo -t:basic`),
                fetchPool(`s:${setCode} r:common -is:promo -t:basic`),
                fetchPool(`s:${setCode} t:land -t:basic -is:promo`),
                fetchPool(`s:${setCode} -is:promo -t:basic`),
                fetchPool(`set:spg`)
            ]);

            if (rares.length === 0) throw new Error("Set not found.");

            const pools = {
                rares: groupByName(rares),
                mythics: groupByName(mythics),
                uncommons: groupByName(uncommons),
                commons: groupByName(commons),
                nonBasicLands: groupByName(nonBasicLands),
                wildcard: groupByName(multiplier > 1 ? anyRarity.filter(c => c.rarity !== 'common') : anyRarity)
            };

            const spgMap = new Map();
            spgAll.forEach(c => spgMap.set(c.name, c));

            const processCard = (card) => {
                if (!card) return null;
                if (preferGuest && spgMap.has(card.name) && Math.random() < 0.5) {
                    const guestVersion = spgMap.get(card.name);
                    console.log(`✨ SWAP: Used Special Guest ID ${guestVersion.collector_number} for "${card.name}"`);
                    return guestVersion;
                }
                return card;
            };

            const header = "section,count,name,mana_cost,type,set,set_code,collector_number,lang,rarity,artist,finish,usd_price,eur_price,tix_price,scryfall_uri,scryfall_id";

            for (let i = 1; i <= packCount; i++) {
                console.log(`--- Generating Pack ${i} ---`);
                let packCards = [];
                const getRand = (pool) => processCard(pickRandomVariant(pool));

                for(let j=0; j<6; j++) packCards.push({card: getRand(pools.commons), foil: false});
                const guestChance = 0.015 * multiplier;
                if (Math.random() < guestChance && spgAll.length > 0) {
                    packCards.push({card: spgAll[Math.floor(Math.random()*spgAll.length)], foil: false});
                } else {
                    packCards.push({card: getRand(pools.commons), foil: false});
                }
                for(let j=0; j<3; j++) packCards.push({card: getRand(pools.uncommons), foil: false});
                packCards.push({card: getRand(pools.wildcard), foil: false});
                const mythicChance = 0.13 * multiplier;
                const pool12 = (Math.random() < mythicChance && Array.from(pools.mythics.keys()).length > 0) ? pools.mythics : pools.rares;
                packCards.push({card: getRand(pool12), foil: false});
                packCards.push({card: getRand(pools.wildcard), foil: foilToggle});
                const landPool = Array.from(pools.nonBasicLands.keys()).length > 0 ? pools.nonBasicLands : pools.uncommons;
                packCards.push({card: getRand(landPool), foil: false});

                let packRows = [header];
                packCards.forEach(obj => { if(obj.card) packRows.push(formatToFullCSV(obj.card, obj.foil)); });

                if (includeBonus) {
                    const bonus = bonusPool[Math.floor(Math.random() * bonusPool.length)];
                    packRows.push(formatToFullCSV(bonus, false, bonus.section));
                }

                const blob = new Blob([packRows.join("\n")], { type: 'text/csv' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.className = "dl-link";
                a.download = `${setCode}-Booster-${i}.csv`;
                a.textContent = `⬇️ Pack ${i}`;
                downloadList.appendChild(a);
            }

            status.textContent = `✅ Successfully generated ${packCount} boosters.`;
            downloadContainer.style.display = "block";
        } catch (e) { status.textContent = "❌ Error: " + e.message; }
        finally { genBtn.disabled = false; }
    });

    initSetList();
</script>

</body>
</html>
